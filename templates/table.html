
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Security Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            color: #173b68;
        }

        form {
            margin: 20px 0;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            background-color: #173b68;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #173b68;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .error {
            color: #b00020;
            margin: 15px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Network Security Prediction</h2>

        <p>Upload your CSV file to generate predictions.</p>

        <form action="/predict" method="post"
              enctype="multipart/form-data">

            <input
                type="file"
                name="file"
                accept=".csv"
                required
            >

            <button type="submit">Upload and Predict</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if table %}
            <h2>Predicted Data</h2>

            <div class="table-wrapper">
                {{ table | safe }}
            </div>
        {% endif %}
    </div>
</body>
</html>
